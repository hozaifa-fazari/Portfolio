<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- This portfolio has moved to its own root domain.
     GitHub Pages cannot issue a real 301, so this is the standard
     equivalent: an instant meta refresh plus a canonical link, which
     search engines treat as a permanent move and which passes the
     old URL's authority to the new one. -->
<meta http-equiv="refresh" content="0; url=https://hozaifa-fazari.github.io/">
<link rel="canonical" href="https://hozaifa-fazari.github.io/">

<title>Moved — Hozaifa Fazari</title>
<meta name="robots" content="noindex">
<meta name="description" content="Hozaifa Fazari's portfolio has moved to hozaifa-fazari.github.io">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23070809'/><text y='72' x='50' text-anchor='middle' font-size='64' font-family='Arial' font-weight='bold' fill='%23F0A32E'>H</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=JetBrains+Mono:wght@400;600&family=Manrope:wght@300;600&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#070809; --bone:#EFEBE2; --muted:#868D97; --line:#21272F;
  --marigold:#F0A32E;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;}
body{
  margin:0;min-height:100vh;background:var(--ink);color:var(--bone);
  font-family:'Manrope',system-ui,sans-serif;
  display:grid;place-items:center;padding:clamp(24px,6vw,64px);
  -webkit-font-smoothing:antialiased;
}
main{max-width:52ch;}
.mark{
  font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;
  letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin:0 0 28px;
}
h1{
  font-family:'Manrope',sans-serif;font-weight:300;
  font-size:clamp(34px,6vw,72px);line-height:1.0;letter-spacing:-.02em;
  text-transform:uppercase;margin:0;
}
h1 b{font-weight:600;display:block;}
p{
  margin:32px 0 0;color:var(--muted);font-size:15px;line-height:1.7;
}
a.go{
  display:inline-flex;align-items:center;gap:10px;margin-top:32px;
  font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;
  letter-spacing:.15em;text-transform:uppercase;
  background:var(--marigold);color:#000;text-decoration:none;
  border:1px solid var(--marigold);border-radius:100px;padding:15px 26px;
  transition:background 200ms var(--ease),border-color 200ms var(--ease);
}
a.go:hover{background:var(--bone);border-color:var(--bone);}
.url{
  font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.04em;
  color:var(--bone);text-decoration:none;border-bottom:1px solid var(--line);
}
.url:hover{border-bottom-color:var(--marigold);}
</style>
</head>
<body>
<main>
  <p class="mark">Hozaifa Fazari</p>
  <h1>This has<b>moved.</b></h1>
  <p>
    The portfolio now lives at its own address. You should arrive there
    automatically — if nothing happens, use the link below.
  </p>
  <p><a class="url" href="https://hozaifa-fazari.github.io/">hozaifa-fazari.github.io</a></p>
  <a class="go" href="https://hozaifa-fazari.github.io/">Continue &#8594;</a>
</main>

<script>
  /* Belt and braces: replace rather than assign, so the old URL does not
     sit in history and trap the visitor on a back-button loop. */
  location.replace('https://hozaifa-fazari.github.io/');
</script>
</body>
</html>
